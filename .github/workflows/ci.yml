name: CloudPulse CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Test Suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/detection-worker/requirements.txt
      - name: Run application tests
        run: |
          PYTHONPATH=services/detection-worker \
          pytest services/detection-worker/tests/ -v
      - name: Run lifecycle tests
        run: bash scripts/test-lifecycle.sh

  build:
    name: Build & Push Image
    needs: test
    runs-on: ubuntu-latest
    # The Azure Container Registry was decommissioned; only push when triggered manually
    # after the registry has been re-provisioned.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: cloudpulseacr01.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push image
        run: |
          docker build \
            --tag cloudpulseacr01.azurecr.io/detection-worker:v2 \
            --tag cloudpulseacr01.azurecr.io/detection-worker:v3 \
            --file services/detection-worker/Dockerfile \
            services/detection-worker/
          docker push cloudpulseacr01.azurecr.io/detection-worker:v2
          docker push cloudpulseacr01.azurecr.io/detection-worker:v3
