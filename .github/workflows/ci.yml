name: CloudPulse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Test Suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/detection-worker/requirements.txt
      - name: Run application tests
        run: |
          PYTHONPATH=services/detection-worker \
          pytest services/detection-worker/tests/ -v
      - name: Run lifecycle tests
        run: bash scripts/test-lifecycle.sh

  build:
    name: Build & Push Image
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Log in to ACR
        run: az acr login --name cloudpulseacr01
      - name: Build and push image
        run: |
          docker build \
            --tag cloudpulseacr01.azurecr.io/detection-worker:v2 \
            --file services/detection-worker/Dockerfile \
            services/detection-worker/
          docker push cloudpulseacr01.azurecr.io/detection-worker:v2
